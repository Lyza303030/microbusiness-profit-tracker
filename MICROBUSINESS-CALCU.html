<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>💼 Microbusiness Profit Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
    body {
        font-family: 'Poppins', sans-serif;
        background-color: #1C1C2E;
        color: #EEE;
        display: flex;
        justify-content: center;
        padding: 50px 0;
    }
    .calculator {
        background-color: #2D2D44;
        padding: 35px;
        border-radius: 25px;
        width: 450px;
        box-shadow: 0 12px 30px rgba(0,0,0,0.6);
    }
    h2 {
        text-align: center;
        font-family: 'Fredoka One', cursive;
        font-size: 28px;
        color: #FF9A76;
        margin-bottom: 20px;
    }
    label { display: block; margin-top: 12px; font-weight: 600; color: #CCCCCC; }
    input {
        width: 100%;
        padding: 10px;
        margin-top: 6px;
        border-radius: 12px;
        border: none;
        font-size: 14px;
        outline: none;
        background-color: #3A3A5A;
        color: #FFF;
    }
    input:focus { box-shadow: 0 0 8px #6BCBFF; }
    button {
        width: 100%;
        padding: 12px;
        margin-top: 15px;
        border-radius: 15px;
        border: none;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
        transition: 0.3s;
    }
    .btn-save { background: linear-gradient(90deg, #322512, #44332c); color: white; margin-bottom: 10px; }
    .btn-save:hover { opacity: 0.9; }
    .btn-tracker { background: linear-gradient(90deg, #452112, #071923); color: white; }
    .btn-tracker:hover { opacity: 0.9; }
    .output, .tracker-output {
        margin-top: 18px;
        padding: 15px;
        border-radius: 15px;
        background-color: #40405A;
        min-height: 80px;
        font-weight: 600;
    }
    .profit { color: #6BCB77; font-weight: 700; }
    .loss { color: #FF6B81; font-weight: 700; }
    ul { padding-left: 20px; margin-top: 10px; }
    .delete-btn {
        margin-left: 10px;
        padding: 2px 8px;
        font-size: 12px;
        background: #FF6B81;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        color: #fff;
    }
    .delete-btn:hover { opacity: 0.8; }
    #resetMonthBtn { margin-top: 10px; background: #FF6B81; color: #fff; }
    #resetMonthBtn:hover { opacity: 0.85; }
</style>
</head>
<body>

<div class="calculator">
    <h2>💼 Microbusiness Profit Tracker</h2>

    <label>🛒 Sales (₱):</label> 
    <input type="number" id="sales" placeholder="Enter total sales for today">

    <label>📦 Material Costs (₱):</label>
    <input type="number" id="materials" placeholder="Raw materials, ingredients">

    <label>👷 Labor / Wages (₱):</label>
    <input type="number" id="labor" placeholder="Daily wages for helpers">

    <label>⚡ Utilities (₱):</label>
    <input type="number" id="utilities" placeholder="Electricity, water">

    <label>🚗 Transport (₱):</label>
    <input type="number" id="transportation" placeholder="Gas, delivery fees">

    <label>📢 Marketing / Promo (₱):</label>
    <input type="number" id="marketing" placeholder="Ads, flyers, promos, discounts">

    <label>📝 Miscellaneous (₱):</label>
    <input type="number" id="misc" placeholder="Unexpected small costs">

    <button class="btn-save" id="saveBtn">💾 Log Today</button>
    <button class="btn-tracker" id="showTrackerBtn">📈 Monthly Summary</button>

    <div class="output" id="dailyOutput">
        Total Expenses: ₱0<br>
        Net Profit: ₱0<br>
        Profit Margin: 0%<br>
        Message: -
    </div>

    <div class="tracker-output" id="trackerOutput" style="display:none;">
        <strong>Monthly Profit Tracker:</strong>
        <ul id="profitList"></ul>
        <p id="totalMonthlyProfit">Total Profit: ₱0</p>
        <button id="resetMonthBtn">🗑 Reset Month</button>
    </div>
</div>

<script>
let dailyProfits = [];

// Calculate daily profit
function calculateDailyProfit() {
    const sales = parseFloat(document.getElementById("sales").value) || 0;
    const materials = parseFloat(document.getElementById("materials").value) || 0;
    const labor = parseFloat(document.getElementById("labor").value) || 0;
    const utilities = parseFloat(document.getElementById("utilities").value) || 0;
    const transport = parseFloat(document.getElementById("transportation").value) || 0;
    const marketing = parseFloat(document.getElementById("marketing").value) || 0;
    const misc = parseFloat(document.getElementById("misc").value) || 0;

    const totalExpenses = materials + labor + utilities + transport + marketing + misc;
    const netProfit = sales - totalExpenses;
    const profitMargin = sales !== 0 ? ((netProfit / sales) * 100).toFixed(2) : 0;

    const message = netProfit >= 0
        ? `💸 Charannn! You earned ₱${netProfit.toFixed(2)} today!`
        : `⚠️ Oops... You lost ₱${Math.abs(netProfit).toFixed(2)} today. Keep going!`;
    const messageClass = netProfit >= 0 ? "profit" : "loss";

    document.getElementById("dailyOutput").innerHTML = `
        Total Expenses: ₱${totalExpenses.toFixed(2)}<br>
        Net Profit: ₱${netProfit.toFixed(2)}<br>
        Profit Margin: ${profitMargin}%<br>
        Message: <span class="${messageClass}">${message}</span>
    `;

    return netProfit;
}

// Save daily profit
document.getElementById("saveBtn").addEventListener("click", () => {
    const netProfit = calculateDailyProfit();
    dailyProfits.push(netProfit);
    alert("✅ Today's profit logged successfully!");
    document.querySelectorAll('input').forEach(input => input.value = '');
});

// Update monthly tracker list
function updateTrackerList() {
    const trackerDiv = document.getElementById("trackerOutput");
    trackerDiv.style.display = "block";

    const profitList = document.getElementById("profitList");
    profitList.innerHTML = "";
    let total = 0;

    dailyProfits.forEach((profit, index) => {
        const li = document.createElement("li");
        li.style.marginBottom = "8px";

        const spanText = document.createElement("span");
        spanText.innerHTML = `Day ${index + 1}: ₱${profit.toFixed(2)}`;
        spanText.className = profit >= 0 ? "profit" : "loss";

        const deleteBtn = document.createElement("button");
        deleteBtn.textContent = "❌ Delete";
        deleteBtn.className = "delete-btn";
        deleteBtn.onclick = () => {
            if (confirm(`Are you sure you want to delete Day ${index + 1}?`)) {
                dailyProfits.splice(index, 1);
                updateTrackerList();
            }
        };

        li.appendChild(spanText);
        li.appendChild(deleteBtn);
        profitList.appendChild(li);

        total += profit;
    });

    document.getElementById("totalMonthlyProfit").innerHTML = `Total Profit: <span class="${total >= 0 ? 'profit' : 'loss'}">₱${total.toFixed(2)}</span>`;
}

// Show monthly tracker
document.getElementById("showTrackerBtn").addEventListener("click", updateTrackerList);

// Reset month
document.getElementById("resetMonthBtn").addEventListener("click", () => {
    if(confirm("Are you sure you want to reset the monthly tracker?")) {
        dailyProfits = [];
        updateTrackerList();
        alert("🗑 Monthly tracker reset!");
    }
});
</script>
</body>
</html>
